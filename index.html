<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Combat Zone - FPS with Bots & Restart</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; user-select: none; }
    #crosshair {
      position: absolute; top: 50%; left: 50%; width: 10px; height: 10px;
      margin-top: -5px; margin-left: -5px; pointer-events: none;
    }
    #crosshair::before, #crosshair::after {
      content: ''; position: absolute; background: rgba(255, 255, 255, 0.8);
    }
    #crosshair::before { top: 4px; left: -5px; width: 20px; height: 2px; }
    #crosshair::after { top: -5px; left: 4px; width: 2px; height: 20px; }
    #hud {
      position: absolute; bottom: 20px; left: 20px; color: #fff;
      font-size: 20px; font-weight: bold; text-shadow: 1px 1px 3px #000;
      pointer-events: none;
    }
    #blocker {
      position: absolute; width: 100%; height: 100%; background: rgba(0,0,0,0.7);
      display: flex; justify-content: center; align-items: center; color: white;
      font-size: 24px; cursor: pointer; text-align: center; z-index: 10;
    }
    #game-over {
      position: absolute; width: 100%; height: 100%; background: rgba(150, 0, 0, 0.7);
      display: none; flex-direction: column; justify-content: center; align-items: center;
      color: white; font-size: 32px; font-weight: bold; z-index: 20;
    }
    #restart-btn {
      margin-top: 20px; padding: 12px 24px; font-size: 20px; background: #fff;
      color: #000; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;
    }
    #restart-btn:hover { background: #ddd; }
  </style>
</head>
<body>

  <div id="crosshair"></div>
  <div id="hud">HP: <span id="hp">100</span> | Kills: <span id="kills">0</span></div>
  <div id="blocker">Click to Play Combat Zone</div>
  
  <div id="game-over">
    <div>YOU DIED!</div>
    <button id="restart-btn">Restart Game (R)</button>
  </div>

  <!-- Three.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script>
    // --- SCENE SETUP ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    scene.fog = new THREE.FogExp2(0x87ceeb, 0.015);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // Lighting
    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.6);
    scene.add(hemiLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(20, 40, 20);
    dirLight.castShadow = true;
    scene.add(dirLight);

    // --- PLAYER VARIABLES ---
    let hp = 100, killCount = 0;
    const playerRadius = 0.8;
    const moveSpeed = 12;
    const keys = {};

    // --- MAP & WALL BOUNDARIES ---
    const walls = [];
    const wallMaterial = new THREE.MeshStandardMaterial({ color: 0x555555, roughness: 0.8 });

    // Ground
    const groundGeo = new THREE.PlaneGeometry(100, 100);
    const groundMat = new THREE.MeshStandardMaterial({ color: 0x228b22 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    function createWall(x, z, w, d, h = 6) {
      const geo = new THREE.BoxGeometry(w, h, d);
      const mesh = new THREE.Mesh(geo, wallMaterial);
      mesh.position.set(x, h / 2, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);
      walls.push(new THREE.Box3().setFromObject(mesh));
    }

    // Outer Perimeter Walls
    createWall(0, -50, 100, 2);
    createWall(0, 50, 100, 2);
    createWall(-50, 0, 2, 100);
    createWall(50, 0, 2, 100);

    // Interior Cover Walls
    createWall(-15, -10, 15, 2);
    createWall(15, 10, 15, 2);
    createWall(0, -25, 2, 20);
    createWall(0, 25, 2, 20);

    // --- GUN MODEL ---
    const gunGroup = new THREE.Group();
    const bodyGeo = new THREE.BoxGeometry(0.15, 0.2, 0.7);
    const gunMat = new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.8 });
    const gunBody = new THREE.Mesh(bodyGeo, gunMat);
    gunGroup.add(gunBody);

    const barrelGeo = new THREE.CylinderGeometry(0.03, 0.03, 0.4);
    const barrel = new THREE.Mesh(barrelGeo, gunMat);
    barrel.rotation.x = Math.PI / 2;
    barrel.position.set(0, 0.05, -0.4);
    gunGroup.add(barrel);

    camera.add(gunGroup);
    gunGroup.position.set(0.3, -0.25, -0.5);
    scene.add(camera);

    // --- BOTS & AI ---
    const bots = [];
    const botMaterial = new THREE.MeshStandardMaterial({ color: 0xd9534f });

    function createBot(x, z) {
      const geo = new THREE.CylinderGeometry(0.8, 0.8, 2, 16);
      const mesh = new THREE.Mesh(geo, botMaterial);
      mesh.position.set(x, 1, z);
      mesh.castShadow = true;
      scene.add(mesh);

      const bot = {
        mesh: mesh,
        hp: 100,
        lastShoot: 0
      };
      bots.push(bot);
    }

    function spawnInitialBots() {
      // Clear remaining bots
      bots.forEach(b => scene.remove(b.mesh));
      bots.length = 0;

      // Spawn fresh set
      createBot(-30, -30);
      createBot(30, -30);
      createBot(-30, 30);
      createBot(30, 30);
    }

    spawnInitialBots();

    // --- CONTROLS & POINTER LOCK ---
    const blocker = document.getElementById('blocker');
    const gameOverScreen = document.getElementById('game-over');
    const restartBtn = document.getElementById('restart-btn');
    let isLocked = false;

    blocker.addEventListener('click', () => {
      document.body.requestPointerLock();
    });

    document.addEventListener('pointerlockchange', () => {
      isLocked = document.pointerLockElement === document.body;
      if (hp > 0) {
        blocker.style.display = isLocked ? 'none' : 'flex';
      }
    });

    let yaw = 0, pitch = 0;
    document.addEventListener('mousemove', (e) => {
      if (!isLocked || hp <= 0) return;
      yaw -= e.movementX * 0.002;
      pitch -= e.movementY * 0.002;
      pitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, pitch));
      camera.rotation.set(pitch, yaw, 0, 'YXZ');
    });

    window.addEventListener('keydown', (e) => {
      keys[e.code] = true;
      if ((e.code === 'KeyR' || e.code === 'Space') && hp <= 0) {
        restartGame();
      }
    });
    window.addEventListener('keyup', (e) => keys[e.code] = false);

    // --- SHOOTING & BULLET TRACERS ---
    const raycaster = new THREE.Raycaster();

    function createTracer(start, end) {
      const points = [start, end];
      const geo = new THREE.BufferGeometry().setFromPoints(points);
      const mat = new THREE.LineBasicMaterial({ color: 0xffd700 });
      const line = new THREE.Line(geo, mat);
      scene.add(line);
      setTimeout(() => scene.remove(line), 50);
    }

    function shoot() {
      if (!isLocked || hp <= 0) return;

      gunGroup.position.z = -0.35;

      const origin = camera.position.clone();
      const dir = new THREE.Vector3();
      camera.getWorldDirection(dir);

      raycaster.set(origin, dir);
      const botMeshes = bots.map(b => b.mesh);
      const intersects = raycaster.intersectObjects(botMeshes);

      let targetPoint = origin.clone().add(dir.clone().multiplyScalar(100));

      if (intersects.length > 0) {
        const hit = intersects[0];
        targetPoint = hit.point;
        const hitBot = bots.find(b => b.mesh === hit.object);

        if (hitBot) {
          hitBot.hp -= 35;
          if (hitBot.hp <= 0) {
            scene.remove(hitBot.mesh);
            bots.splice(bots.indexOf(hitBot), 1);
            killCount++;
            document.getElementById('kills').innerText = killCount;
            setTimeout(() => {
              if (hp > 0) createBot((Math.random() - 0.5) * 60, (Math.random() - 0.5) * 60);
            }, 3000);
          }
        }
      }

      const muzzlePos = gunGroup.getWorldPosition(new THREE.Vector3());
      createTracer(muzzlePos, targetPoint);
    }

    window.addEventListener('mousedown', (e) => {
      if (e.button === 0) shoot();
    });

    // --- RESTART SYSTEM ---
    function restartGame() {
      hp = 100;
      killCount = 0;
      document.getElementById('hp').innerText = hp;
      document.getElementById('kills').innerText = killCount;

      camera.position.set(0, 1.7, 0);
      yaw = 0; pitch = 0;
      camera.rotation.set(0, 0, 0);

      spawnInitialBots();

      gameOverScreen.style.display = 'none';
      document.body.requestPointerLock();
    }

    restartBtn.addEventListener('click', restartGame);

    // --- GAME LOOP ---
    const clock = new THREE.Clock();

    function update() {
      requestAnimationFrame(update);
      const delta = clock.getDelta();

      if (isLocked && hp > 0) {
        // Player Movement
        const moveVec = new THREE.Vector3();
        if (keys['KeyW']) moveVec.z -= 1;
        if (keys['KeyS']) moveVec.z += 1;
        if (keys['KeyA']) moveVec.x -= 1;
        if (keys['KeyD']) moveVec.x += 1;

        moveVec.normalize();
        moveVec.applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
        moveVec.multiplyScalar(moveSpeed * delta);

        const nextPos = camera.position.clone().add(moveVec);
        let collide = false;

        for (let wall of walls) {
          if (
            nextPos.x + playerRadius > wall.min.x && nextPos.x - playerRadius < wall.max.x &&
            nextPos.z + playerRadius > wall.min.z && nextPos.z - playerRadius < wall.max.z
          ) {
            collide = true;
            break;
          }
        }

        if (!collide) {
          camera.position.add(moveVec);
        }

        gunGroup.position.z = THREE.MathUtils.lerp(gunGroup.position.z, -0.5, delta * 10);
      }

      // Update Bot AI
      const now = clock.getElapsedTime();
      bots.forEach(bot => {
        if (hp <= 0) return;

        const dirToPlayer = camera.position.clone().sub(bot.mesh.position);
        dirToPlayer.y = 0;
        const dist = dirToPlayer.length();
        dirToPlayer.normalize();

        if (dist > 3) {
          bot.mesh.position.add(dirToPlayer.multiplyScalar(3 * delta));
        }

        if (dist < 20 && now - bot.lastShoot > 2) {
          bot.lastShoot = now;
          hp = Math.max(0, hp - 10);
          document.getElementById('hp').innerText = hp;
          createTracer(bot.mesh.position, camera.position);

          if (hp === 0) {
            document.exitPointerLock();
            gameOverScreen.style.display = 'flex';
          }
        }
      });

      renderer.render(scene, camera);
    }

    camera.position.set(0, 1.7, 0);
    update();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
