<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Combat Zone FPS - Procedural Realistic Engine</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', Courier, monospace; user-select: none; color: #fff; }
    
    /* Crosshair */
    #crosshair { position: absolute; top: 50%; left: 50%; width: 12px; height: 12px; margin: -6px 0 0 -6px; pointer-events: none; }
    #crosshair::before, #crosshair::after { content: ''; position: absolute; background: rgba(255, 255, 255, 0.9); box-shadow: 0 0 3px #000; }
    #crosshair::before { top: 5px; left: -6px; width: 24px; height: 2px; }
    #crosshair::after { top: -6px; left: 5px; width: 2px; height: 24px; }
    
    /* HUD */
    #hud { position: absolute; bottom: 20px; left: 20px; font-size: 18px; font-weight: bold; pointer-events: none; display: flex; flex-direction: column; gap: 6px; }
    #hp-bar-container { width: 200px; height: 14px; background: rgba(255,0,0,0.3); border: 2px solid #fff; border-radius: 3px; }
    #hp-fill { height: 100%; background: lime; width: 100%; transition: width 0.1s; }
    #weapon-info { position: absolute; bottom: 20px; right: 20px; text-align: right; pointer-events: none; }
    #weapon-name { font-size: 26px; color: #00ffff; font-weight: bold; text-shadow: 1px 1px 3px #000; }
    
    /* Overlays */
    #blocker { position: absolute; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; justify-content: center; align-items: center; font-size: 28px; cursor: pointer; text-align: center; z-index: 100; }
    #game-over { position: absolute; width: 100%; height: 100%; background: rgba(180, 0, 0, 0.7); display: none; justify-content: center; align-items: center; flex-direction: column; color: white; font-size: 40px; font-weight: bold; z-index: 200; }
    #restart-btn { margin-top: 20px; padding: 12px 24px; font-size: 20px; background: #fff; color: #000; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }

    /* Mini Map */
    #mini-map { position: absolute; top: 20px; left: 20px; width: 140px; height: 140px; background: rgba(0,0,0,0.6); border: 2px solid rgba(255,255,255,0.8); overflow: hidden; border-radius: 50%; pointer-events: none; }
    #mini-map-content { position: relative; width: 100%; height: 100%; }
    #mini-map-player { position: absolute; width: 8px; height: 8px; background: #00ff00; border-radius: 50%; top: 66px; left: 66px; z-index: 10; }
    .mini-map-wall { position: absolute; background: rgba(150,150,150,0.8); z-index: 1; }
    .mini-map-bot { position: absolute; width: 8px; height: 8px; background: #ff3333; border-radius: 50%; z-index: 5; }
  </style>
</head>
<body>

  <div id="crosshair"></div>
  
  <div id="mini-map">
    <div id="mini-map-content">
      <div id="mini-map-player"></div>
    </div>
  </div>

  <div id="hud">
    <div>SOLDIER_UNIT</div>
    <div id="hp-bar-container"><div id="hp-fill"></div></div>
    <div>HP: <span id="hp">100</span> | KILLS: <span id="kills">0</span></div>
  </div>

  <div id="weapon-info">
    <div id="weapon-name">M4 RIFLE</div>
    <div style="font-size: 14px;">[1] RIFLE | [2] SHOTGUN</div>
  </div>

  <div id="blocker">
    <div style="color: #00ffff; font-size: 36px; font-weight: bold;">COMBAT ZONE</div>
    <div style="font-size: 18px; margin-top: 20px; background: rgba(255,255,255,0.1); padding: 20px; border-radius: 8px; line-height: 1.6;">
      Click Anywhere to Play<br><br>
      <b>[W,A,S,D]</b> - Move | <b>[SPACE]</b> - Jump | <b>[LEFT CLICK]</b> - Shoot<br>
      <b>[1]</b> - Rifle (Auto) | <b>[2]</b> - Shotgun (Spread)<br>
      <b>[P]</b> - Toggle Mini-Map
    </div>
  </div>
  
  <div id="game-over">
    <div>YOU DIED</div>
    <button id="restart-btn">Restart Match (R)</button>
  </div>

  <!-- Three.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script>
    // --- PROCEDURAL TEXTURE GENERATORS (No images required) ---
    function createGrassTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512; canvas.height = 512;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#2d5a1e'; ctx.fillRect(0, 0, 512, 512);
      for (let i = 0; i < 20000; i++) {
        ctx.fillStyle = Math.random() > 0.5 ? '#3a6f28' : '#1e3f13';
        ctx.fillRect(Math.random() * 512, Math.random() * 512, 2, 4);
      }
      return new THREE.CanvasTexture(canvas);
    }

    function createConcreteTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512; canvas.height = 512;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#555555'; ctx.fillRect(0, 0, 512, 512);
      for (let i = 0; i < 30000; i++) {
        const val = Math.floor(Math.random() * 80);
        ctx.fillStyle = `rgb(${80 + val},${80 + val},${80 + val})`;
        ctx.fillRect(Math.random() * 512, Math.random() * 512, 2, 2);
      }
      return new THREE.CanvasTexture(canvas);
    }

    // --- GAME DATA & SETUP ---
    const WEAPONS = {
      0: { name: 'M4 RIFLE', damage: 30, range: 200, fireInterval: 0.12, spread: 0.005, recoilZ: -0.12 },
      1: { name: 'SAWED-OFF', damage: 15, range: 50, fireInterval: 0.75, spread: 0.08, pellets: 8, recoilZ: -0.3 }
    };

    const ARENA_SIZE = 100;
    const playerRadius = 0.8;
    const playerHeight = 1.7;
    const moveSpeed = 14;
    const jumpHeight = 9;
    const gravity = -28;

    let hp = 100, kills = 0, isAlive = true, isLocked = false;
    let currentWeaponId = 0, lastFireTime = 0, velocityY = 0, canJump = true;
    let recoilPosZ = -0.5, recoilVelZ = 0;

    const keys = {};
    let mouseLeft = false;

    // --- THREE.JS SCENE SETUP ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x222831);
    scene.fog = new THREE.FogExp2(0x222831, 0.018);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.rotation.order = 'YXZ';

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    // Lights
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
    scene.add(ambientLight);

    const sun = new THREE.DirectionalLight(0xffffff, 0.9);
    sun.position.set(40, 60, 20);
    sun.castShadow = true;
    sun.shadow.mapSize.width = 2048;
    sun.shadow.mapSize.height = 2048;
    scene.add(sun);

    // Ground
    const grassTex = createGrassTexture();
    grassTex.wrapS = grassTex.wrapT = THREE.RepeatWrapping;
    grassTex.repeat.set(25, 25);
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(ARENA_SIZE, ARENA_SIZE),
      new THREE.MeshStandardMaterial({ map: grassTex, roughness: 0.9 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // Walls & Environment
    const concreteTex = createConcreteTexture();
    concreteTex.wrapS = concreteTex.wrapT = THREE.RepeatWrapping;
    const wallMat = new THREE.MeshStandardMaterial({ map: concreteTex, roughness: 0.8 });
    const wallColliders = [];
    const miniMapWallData = [];

    function createWall(x, z, w, d, h = 8) {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallMat);
      mesh.position.set(x, h / 2, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);
      wallColliders.push(new THREE.Box3().setFromObject(mesh));
      miniMapWallData.push({ x, z, w, d });
    }

    // Map Design
    createWall(0, -ARENA_SIZE/2, ARENA_SIZE, 2); // Outer North
    createWall(0, ARENA_SIZE/2, ARENA_SIZE, 2);  // Outer South
    createWall(-ARENA_SIZE/2, 0, 2, ARENA_SIZE); // Outer West
    createWall(ARENA_SIZE/2, 0, 2, ARENA_SIZE);  // Outer East

    createWall(-15, -10, 15, 3);
    createWall(15, 10, 15, 3);
    createWall(0, -25, 3, 20);
    createWall(0, 25, 3, 20);

    // --- GUN MODELS ---
    const gunGroup = new THREE.Group();
    camera.add(gunGroup);
    scene.add(camera);

    const weaponMaterial = new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.8, roughness: 0.3 });
    
    function createGunModel(id) {
      const g = new THREE.Group();
      g.visible = false;
      const body = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.2, 0.7), weaponMaterial);
      const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.5), weaponMaterial);
      barrel.rotation.x = Math.PI / 2;
      barrel.position.set(0, 0.04, -0.4);
      g.add(body); g.add(barrel);
      g.position.set(0.35, -0.25, -0.5);
      gunGroup.add(g);
      return g;
    }

    const gunModels = { 0: createGunModel(0), 1: createGunModel(1) };
    function updateWeaponVisuals() {
      for (let id in gunModels) gunModels[id].visible = false;
      gunModels[currentWeaponId].visible = true;
      document.getElementById('weapon-name').innerText = WEAPONS[currentWeaponId].name;
    }
    updateWeaponVisuals();

    // --- BOTS & AI ---
    const bots = [];
    const botMaterial = new THREE.MeshStandardMaterial({ color: 0xd9534f, roughness: 0.5 });

    function createBot(x, z) {
      const mesh = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 0.8, 2, 16), botMaterial);
      mesh.position.set(x, 1, z);
      mesh.castShadow = true;
      scene.add(mesh);
      bots.push({ mesh, hp: 100, lastShoot: 0 });
    }

    function spawnInitialBots() {
      bots.forEach(b => scene.remove(b.mesh));
      bots.length = 0;
      createBot(-30, -30); createBot(30, -30);
      createBot(-30, 30);  createBot(30, 30);
    }
    spawnInitialBots();

    // --- MINI-MAP ---
    const miniMapContent = document.getElementById('mini-map-content');
    const mapScale = 140 / ARENA_SIZE;
    let miniMapVisible = true;

    miniMapWallData.forEach(w => {
      const el = document.createElement('div');
      el.className = 'mini-map-wall';
      el.style.width = `${w.w * mapScale}px`;
      el.style.height = `${w.d * mapScale}px`;
      el.style.left = `${(w.x + ARENA_SIZE/2 - w.w/2) * mapScale}px`;
      el.style.top = `${(w.z + ARENA_SIZE/2 - w.d/2) * mapScale}px`;
      miniMapContent.appendChild(el);
    });

    const botMapIcons = [];
    function updateMiniMap() {
      if (!miniMapVisible || !isLocked) return;
      const mapX = (camera.position.x + ARENA_SIZE/2);
      const mapZ = (camera.position.z + ARENA_SIZE/2);
      miniMapContent.style.left = `${70 - mapX * mapScale}px`;
      miniMapContent.style.top = `${70 - mapZ * mapScale}px`;

      bots.forEach((bot, idx) => {
        let icon = botMapIcons[idx];
        if (!icon) {
          icon = document.createElement('div');
          icon.className = 'mini-map-bot';
          miniMapContent.appendChild(icon);
          botMapIcons[idx] = icon;
        }
        icon.style.left = `${(bot.mesh.position.x + ARENA_SIZE/2 - 4) * mapScale}px`;
        icon.style.top = `${(bot.mesh.position.z + ARENA_SIZE/2 - 4) * mapScale}px`;
        icon.style.display = isAlive ? 'block' : 'none';
      });
    }

    // --- CONTROLS & EVENT LISTENERS ---
    const blocker = document.getElementById('blocker');
    const gameOverScreen = document.getElementById('game-over');
    const restartBtn = document.getElementById('restart-btn');

    blocker.addEventListener('click', () => document.body.requestPointerLock());

    document.addEventListener('pointerlockchange', () => {
      isLocked = document.pointerLockElement === document.body;
      if (isLocked) blocker.style.display = 'none';
      else if (isAlive) blocker.style.display = 'flex';
    });

    let yaw = 0, pitch = 0;
    document.addEventListener('mousemove', (e) => {
      if (!isLocked || !isAlive) return;
      yaw -= e.movementX * 0.002;
      pitch -= e.movementY * 0.002;
      pitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, pitch));
      camera.rotation.set(pitch, yaw, 0, 'YXZ');
    });

    window.addEventListener('keydown', (e) => {
      keys[e.code] = true;
      if (e.code === 'KeyP') { miniMapVisible = !miniMapVisible; document.getElementById('mini-map').style.display = miniMapVisible ? 'block' : 'none'; }
      if (e.code === 'Digit1') { currentWeaponId = 0; updateWeaponVisuals(); }
      if (e.code === 'Digit2') { currentWeaponId = 1; updateWeaponVisuals(); }
      if (e.code === 'Space' && canJump && isAlive && isLocked) { velocityY = jumpHeight; canJump = false; }
      if ((e.code === 'KeyR') && !isAlive) restartGame();
    });
    window.addEventListener('keyup', (e) => keys[e.code] = false);

    window.addEventListener('mousedown', (e) => { if (e.button === 0) mouseLeft = true; });
    window.addEventListener('mouseup', (e) => { if (e.button === 0) mouseLeft = false; });

    // --- SHOOTING SYSTEM ---
    const raycaster = new THREE.Raycaster();

    function createTracer(start, end) {
      const geo = new THREE.BufferGeometry().setFromPoints([start, end]);
      const mat = new THREE.LineBasicMaterial({ color: 0xffd700, transparent: true, opacity: 0.8 });
      const line = new THREE.Line(geo, mat);
      scene.add(line);
      setTimeout(() => scene.remove(line), 40);
    }

    function shoot() {
      const now = performance.now() / 1000;
      const w = WEAPONS[currentWeaponId];
      if (now - lastFireTime < w.fireInterval || !isLocked || !isAlive) return;
      lastFireTime = now;

      recoilVelZ += w.recoilZ;

      const count = currentWeaponId === 1 ? w.pellets : 1;
      for (let i = 0; i < count; i++) {
        const dir = new THREE.Vector3(
          (Math.random() - 0.5) * w.spread,
          (Math.random() - 0.5) * w.spread,
          -1
        ).applyEuler(camera.rotation).normalize();

        raycaster.set(camera.position, dir);
        const botMeshes = bots.map(b => b.mesh);
        const intersects = raycaster.intersectObjects(botMeshes);

        let target = camera.position.clone().add(dir.multiplyScalar(w.range));
        if (intersects.length > 0) {
          target = intersects[0].point;
          const hitBot = bots.find(b => b.mesh === intersects[0].object);
          if (hitBot) {
            hitBot.hp -= w.damage;
            if (hitBot.hp <= 0) {
              scene.remove(hitBot.mesh);
              bots.splice(bots.indexOf(hitBot), 1);
              kills++;
              document.getElementById('kills').innerText = kills;
              setTimeout(() => {
                if (isAlive) createBot((Math.random() - 0.5) * 60, (Math.random() - 0.5) * 60);
              }, 2500);
            }
          }
        }
        createTracer(gunModels[currentWeaponId].getWorldPosition(new THREE.Vector3()), target);
      }
    }

    // --- RESTART GAME ---
    function restartGame() {
      hp = 100; kills = 0; isAlive = true;
      document.getElementById('hp').innerText = hp;
      document.getElementById('hp-fill').style.width = '100%';
      document.getElementById('kills').innerText = kills;
      camera.position.set(0, playerHeight, 0);
      yaw = 0; pitch = 0; camera.rotation.set(0, 0, 0);
      spawnInitialBots();
      gameOverScreen.style.display = 'none';
      document.body.requestPointerLock();
    }
    restartBtn.addEventListener('click', restartGame);

    // --- MAIN GAME LOOP ---
    const clock = new THREE.Clock();

    function update() {
      requestAnimationFrame(update);
      const delta = clock.getDelta();

      if (isLocked && isAlive) {
        if (mouseLeft) shoot();

        // Physics / Jumping
        velocityY += gravity * delta;
        camera.position.y += velocityY * delta;
        if (camera.position.y < playerHeight) {
          camera.position.y = playerHeight; velocityY = 0; canJump = true;
        }

        // Recoil
        gunModels[currentWeaponId].position.z += recoilVelZ * delta;
        recoilPosZ = THREE.MathUtils.lerp(recoilPosZ, -0.5, delta * 10);
        gunModels[currentWeaponId].position.z = recoilPosZ;
        recoilVelZ *= 0.8;

        // Player Movement
        const moveVec = new THREE.Vector3();
        if (keys['KeyW']) moveVec.z -= 1; if (keys['KeyS']) moveVec.z += 1;
        if (keys['KeyA']) moveVec.x -= 1; if (keys['KeyD']) moveVec.x += 1;
        moveVec.normalize().applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw).multiplyScalar(moveSpeed * delta);

        const nextPos = camera.position.clone().add(moveVec);
        let collide = false;
        for (let wall of wallColliders) {
          if (
            nextPos.x + playerRadius > wall.min.x && nextPos.x - playerRadius < wall.max.x &&
            nextPos.z + playerRadius > wall.min.z && nextPos.z - playerRadius < wall.max.z
          ) { collide = true; break; }
        }
        if (!collide) camera.position.add(moveVec);
      }

      // AI Logic
      const now = clock.getElapsedTime();
      bots.forEach(bot => {
        if (!isAlive) return;
        const dir = camera.position.clone().sub(bot.mesh.position);
        dir.y = 0;
        const dist = dir.length();
        dir.normalize();

        if (dist > 3) bot.mesh.position.add(dir.multiplyScalar(3.5 * delta));

        if (dist < 22 && now - bot.lastShoot > 1.8) {
          bot.lastShoot = now;
          hp = Math.max(0, hp - 12);
          document.getElementById('hp').innerText = hp;
          document.getElementById('hp-fill').style.width = `${hp}%`;
          createTracer(bot.mesh.position, camera.position);

          if (hp === 0) {
            isAlive = false;
            document.exitPointerLock();
            gameOverScreen.style.display = 'flex';
          }
        }
      });

      updateMiniMap();
      renderer.render(scene, camera);
    }

    camera.position.set(0, playerHeight, 0);
    update();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
